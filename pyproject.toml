[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "walmart-seller-analyzer"
version = "0.1.0"
description = "Python SDK for Walmart Seller Analyzer on Apify. Walmart Seller Analyzer estimates competitor sales, revenue, profit, and product opportunities. Run bulk Walmart seller and product research with no login or cookies. Pay per result from $5/1K products. Export Walmart data to CSV, JSON, Excel, API, or"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ApiVault Labs" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0"]
keywords = ["walmart", "walmart-seller", "product-research", "revenue-estimation", "competitive-intelligence", "apify", "python-sdk"]

[project.urls]
Homepage = "https://github.com/apivault-labs/walmart-seller-analyzer-python"
Documentation = "https://github.com/apivault-labs/walmart-seller-analyzer-python#readme"
"Apify Actor" = "https://apify.com/apivault_labs/walmart-seller-revenue-product-opportunity-analyzer"
"Bug Tracker" = "https://github.com/apivault-labs/walmart-seller-analyzer-python/issues"

[tool.setuptools.packages.find]
include = ["walmart_seller_analyzer*"]
